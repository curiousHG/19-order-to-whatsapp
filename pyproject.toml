[project]
name = "ecommerce"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Django 5.2 LTS — supported until April 2028.
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "django-cors-headers>=4.7,<5.0",
    # gunicorn 23 fixes CVE-2024-1135 (HTTP request smuggling).
    "gunicorn>=23.0,<24.0",
    "whitenoise[brotli]>=6.8,<7.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "Pillow>=11.0",
    "cloudinary>=1.40",
    "django-cloudinary-storage>=0.3",
]

[dependency-groups]
dev = [
    "coverage>=7.5",
]
