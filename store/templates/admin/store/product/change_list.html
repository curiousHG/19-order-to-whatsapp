{% extends "admin/change_list.html" %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    .object-tools form { display: inline; }
    .object-tools button {
      background: var(--object-tools-bg);
      border: none;
      border-radius: 15px;
      color: var(--object-tools-fg);
      cursor: pointer;
      font-size: 0.6875rem;
      letter-spacing: 0.5px;
      padding: 3px 12px;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .object-tools button:focus,
    .object-tools button:hover { background: var(--object-tools-hover-bg); }
  </style>
{% endblock %}

{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'admin:store_product_publish_item_list' %}">
      {% csrf_token %}
      <button type="submit">Publish item list PDF</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
